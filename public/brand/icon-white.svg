<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 200" fill="none" role="img" aria-label="OBSIDIAN logo mark">
  <!-- Crystal shard — white version for dark backgrounds -->

  <!-- Face A: top face, brightest — facing upward light -->
  <polygon points="88,17 160,9 132,56" fill="#FFFFFF" opacity="0.92"/>

  <!-- Face B: right spike — side shadow -->
  <polygon points="160,9 220,56 182,82 132,56" fill="#FFFFFF" opacity="0.56"/>

  <!-- Face C: right mid face -->
  <polygon points="182,82 220,56 204,110 170,152 132,56" fill="#FFFFFF" opacity="0.64"/>

  <!-- Face D: main front body — largest face, full brightness -->
  <polygon points="88,17 132,56 170,152 118,170 70,152 28,82" fill="#FFFFFF" opacity="1"/>

  <!-- Face E: upper-left bevel -->
  <polygon points="28,82 88,17 52,30" fill="#FFFFFF" opacity="0.76"/>

  <!-- Face F: bottom-right underside -->
  <polygon points="170,152 204,110 190,158 118,170" fill="#FFFFFF" opacity="0.52"/>

  <!-- Face G: lower-left wing -->
  <polygon points="28,82 70,152 46,162 4,120" fill="#FFFFFF" opacity="0.82"/>

  <!-- Face H: wing underside -->
  <polygon points="70,152 118,170 96,178 46,162" fill="#FFFFFF" opacity="0.60"/>

  <!-- Internal ridge lines — very subtle -->
  <line x1="88"  y1="17"  x2="132" y2="56"  stroke="#FFFFFF" stroke-width="0.6" opacity="0.45"/>
  <line x1="132" y1="56"  x2="160" y2="9"   stroke="#FFFFFF" stroke-width="0.5" opacity="0.35"/>
  <line x1="132" y1="56"  x2="170" y2="152" stroke="#FFFFFF" stroke-width="0.5" opacity="0.28"/>
  <line x1="28"  y1="82"  x2="70"  y2="152" stroke="#FFFFFF" stroke-width="0.4" opacity="0.32"/>
  <line x1="132" y1="56"  x2="28"  y2="82"  stroke="#FFFFFF" stroke-width="0.4" opacity="0.30"/>
</svg>
